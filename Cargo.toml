[package]
name = "claude-hook-notify"
version = "0.0.1"
edition = "2024"
description = "Post a macOS notification from the command line or a Claude Code hook"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
